<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>MotoJá - Elite Mobility</title>
  
  <!-- Estilos Profissionais -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#FFC107',
            bg: '#0B0B0E',
            s1: '#15151A',
            s2: '#1E1E26',
            stroke: '#2A2A33',
            danger: '#FF4D4D',
            success: '#2EE59D'
          }
        }
      }
    }
  </script>
  
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.475.0",
    "react-dom/client": "https://esm.sh/react-dom@^19.0.0/client",
    "react-dom": "https://esm.sh/react-dom@^19.0.0",
    "react": "https://esm.sh/react@^19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@^0.21.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
    
    body { 
      margin: 0; 
      background: #0B0B0E; 
      color: white; 
      font-family: 'Inter', sans-serif; 
      overflow: hidden;
      overscroll-behavior: none;
    }

    #map {
      height: 100vh;
      width: 100vw;
      z-index: 0;
      filter: invert(100%) hue-rotate(180deg) brightness(0.6) contrast(1.2);
    }

    .leaflet-control-zoom { display: none !important; }
    .leaflet-attribution-flag { display: none !important; }
    
    * { -webkit-tap-highlight-color: transparent; }
    
    .glass {
      background: rgba(21, 21, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(42, 42, 51, 0.5);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
