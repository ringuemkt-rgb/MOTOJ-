<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD54F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15151A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0B0E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background (Manual 1.2) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Defining Border -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="none" stroke="#FFC107" stroke-width="4" opacity="0.3"/>
  
  <!-- Central M Symbol Styled as Moto (Manual 1.1) -->
  <g transform="translate(128, 128) scale(0.5)" filter="url(#shadow)">
    <path d="M512 256C512 114.6 397.4 0 256 0S0 114.6 0 256s114.6 256 256 256 256-114.6 256-256z" fill="none" />
    <!-- Stylized M Moto -->
    <path d="M432 256h-64v-32c0-17.7-14.3-32-32-32H176c-17.7 0-32 14.3-32 32v32H80c-44.2 0-80 35.8-80 80v64c0 44.2 35.8 80 80 80h352c44.2 0 80-35.8 80-80v-64c0-44.2-35.8-80-80-80zm-176-32h64v32h-64v-32zm-96 0h64v32h-64v-32z" fill="url(#goldGrad)" transform="translate(-10, 40)"/>
    <circle cx="256" cy="200" r="80" fill="url(#goldGrad)" opacity="0.9" />
